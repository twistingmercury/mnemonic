# This docker compose file is used to run mnemonic locally so it can be developed against.

services:
  dev_postgres:
    image: ghcr.io/twistingmercury/librarian-postgres:v1.0.0-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: mnemonic
      POSTGRES_USER: mnemonic
      POSTGRES_PASSWORD: mnemonic_dev
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemonic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  dev_neo4j:
    image: ghcr.io/twistingmercury/librarian-neo4j:v1.0.0-dev
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mnemonic_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - dev_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mnemonic_dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  dev_mcp:
    image: ghcr.io/twistingmercury/librarian-mcp:latest-dev
    restart: unless-stopped
    ports:
      - "18090:8080"
      - "18091:8081"
      - "19091:9090"
    environment:
      LIBRARIAN_DATABASE_POSTGRES_HOST: dev_postgres
      LIBRARIAN_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      LIBRARIAN_DATABASE_POSTGRES_SSL_MODE: disable
      LIBRARIAN_DATABASE_NEO4J_URI: bolt://dev_neo4j:7687
      LIBRARIAN_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      LIBRARIAN_OPENAI_API_KEY: ${LIBRARIAN_OPENAI_API_KEY}
      LIBRARIAN_MCP_PORT: 8081
      LIBRARIAN_MCP_DEFAULT_SEARCH_THRESHOLD: 0.5
      LIBRARIAN_LOGGING_LEVEL: debug
    depends_on:
      dev_neo4j:
        condition: service_healthy
      dev_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mnemonic", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  dev_rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "15672:5672"
      - "25672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mnemonic
      RABBITMQ_DEFAULT_PASS: mnemonic_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  dev_api:
    image: ghcr.io/twistingmercury/librarian-api:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "13000:8080"
    environment:
      LIBRARIAN_DATABASE_POSTGRES_HOST: dev_postgres
      LIBRARIAN_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      LIBRARIAN_DATABASE_POSTGRES_SSL_MODE: disable
      LIBRARIAN_DATABASE_NEO4J_URI: bolt://dev_neo4j:7687
      LIBRARIAN_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      LIBRARIAN_OPENAI_API_KEY: ${LIBRARIAN_OPENAI_API_KEY}
      LIBRARIAN_LOGGING_LEVEL: debug
      LIBRARIAN_QUEUE_RABBITMQ_HOST: dev_rabbitmq
      LIBRARIAN_QUEUE_RABBITMQ_USER: mnemonic
      LIBRARIAN_QUEUE_RABBITMQ_PASSWORD: mnemonic_dev
    depends_on:
      dev_neo4j:
        condition: service_healthy
      dev_postgres:
        condition: service_healthy
      dev_rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mnemonic-api", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  dev_enricher:
    image: ghcr.io/twistingmercury/librarian-enricher:latest-dev
    restart: unless-stopped
    environment:
      LIBRARIAN_DATABASE_POSTGRES_HOST: dev_postgres
      LIBRARIAN_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      LIBRARIAN_DATABASE_POSTGRES_SSL_MODE: disable
      LIBRARIAN_DATABASE_NEO4J_URI: bolt://dev_neo4j:7687
      LIBRARIAN_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      LIBRARIAN_OPENAI_API_KEY: ${LIBRARIAN_OPENAI_API_KEY}
      LIBRARIAN_LOGGING_LEVEL: debug
      LIBRARIAN_QUEUE_PROVIDER: rabbitmq
      LIBRARIAN_QUEUE_RABBITMQ_HOST: dev_rabbitmq
      LIBRARIAN_QUEUE_RABBITMQ_USER: mnemonic
      LIBRARIAN_QUEUE_RABBITMQ_PASSWORD: mnemonic_dev
      LIBRARIAN_QUEUE_RABBITMQ_QUEUE: enrichment-jobs
    depends_on:
      dev_neo4j:
        condition: service_healthy
      dev_postgres:
        condition: service_healthy
      dev_rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mnemonic-enricher", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

volumes:
  dev_postgres_data:
  dev_neo4j_data:

networks:
  dev_network:
    driver: bridge
