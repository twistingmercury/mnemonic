name: Mnemonic Gateway CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: OPA policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.4.2
      - run: make test-policy

  envoy:
    name: Envoy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make validate-envoy

  e2e:
    name: Gateway end-to-end (stub services)
    runs-on: ubuntu-latest
    needs: [policy, envoy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: test/e2e/go.mod
          cache: false
      - run: make e2e-stub
      - if: failure()
        run: docker compose -f test/compose.stub.yaml logs
