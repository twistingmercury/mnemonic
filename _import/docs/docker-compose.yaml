services:
  dev_postgres:
    image: ghcr.io/twistingmercury/librarian-postgres:v1.0.0-dev

    restart: unless-stopped
    ports:
      - "15432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - librarian_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemonic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dev_neo4j:
    image: ghcr.io/twistingmercury/librarian-neo4j:v1.0.0-dev
    restart: unless-stopped
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - dev_neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/mnemonic_dev
    networks:
      - librarian_network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mnemonic_dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dev_rabbitmq:
    image: rabbitmq:4.0-management
    restart: unless-stopped
    ports:
      - "15672:5672"
      - "25672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mnemonic
      RABBITMQ_DEFAULT_PASS: mnemonic_dev
    networks:
      - librarian_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dev_mcp:
    image: ghcr.io/twistingmercury/librarian-mcp:latest-dev
    pull_policy: always
    restart: unless-stopped
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD", "/mnemonic", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    environment:
      LIBRARIAN_DATABASE_POSTGRES_HOST: dev_postgres
      LIBRARIAN_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      LIBRARIAN_DATABASE_POSTGRES_SSL_MODE: disable
      LIBRARIAN_DATABASE_NEO4J_URI: bolt://dev_neo4j:7687
      LIBRARIAN_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      LIBRARIAN_MCP_PORT: 8081
      LIBRARIAN_MCP_DEFAULT_SEARCH_THRESHOLD: 0.5
      LIBRARIAN_LOGGING_LEVEL: debug
      LIBRARIAN_OPENAI_API_KEY: ${LIBRARIAN_OPENAI_API_KEY}
    networks:
      - librarian_network
    depends_on:
      dev_postgres:
        condition: service_healthy
      dev_neo4j:
        condition: service_healthy

  dev_api:
    image: ghcr.io/twistingmercury/librarian-api:latest-dev
    pull_policy: always
    restart: unless-stopped
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "/mnemonic-api", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    environment:
      LIBRARIAN_DATABASE_POSTGRES_HOST: dev_postgres
      LIBRARIAN_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      LIBRARIAN_DATABASE_POSTGRES_SSL_MODE: disable
      LIBRARIAN_DATABASE_NEO4J_URI: bolt://dev_neo4j:7687
      LIBRARIAN_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      LIBRARIAN_QUEUE_RABBITMQ_HOST: dev_rabbitmq
      LIBRARIAN_QUEUE_RABBITMQ_USER: mnemonic
      LIBRARIAN_QUEUE_RABBITMQ_PASSWORD: mnemonic_dev
      LIBRARIAN_LOGGING_LEVEL: debug
      LIBRARIAN_OPENAI_API_KEY: ${LIBRARIAN_OPENAI_API_KEY}
    networks:
      - librarian_network
    depends_on:
      dev_postgres:
        condition: service_healthy
      dev_neo4j:
        condition: service_healthy
      dev_rabbitmq:
        condition: service_healthy

  dev_enricher:
    image: ghcr.io/twistingmercury/librarian-enricher:latest-dev
    pull_policy: always
    restart: unless-stopped
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD", "/mnemonic-enricher", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    environment:
      LIBRARIAN_DATABASE_POSTGRES_HOST: dev_postgres
      LIBRARIAN_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      LIBRARIAN_DATABASE_POSTGRES_SSL_MODE: disable
      LIBRARIAN_DATABASE_NEO4J_URI: bolt://dev_neo4j:7687
      LIBRARIAN_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      LIBRARIAN_QUEUE_PROVIDER: rabbitmq
      LIBRARIAN_QUEUE_RABBITMQ_HOST: dev_rabbitmq
      LIBRARIAN_QUEUE_RABBITMQ_USER: mnemonic
      LIBRARIAN_QUEUE_RABBITMQ_PASSWORD: mnemonic_dev
      LIBRARIAN_QUEUE_RABBITMQ_QUEUE: enrichment-jobs
      LIBRARIAN_LOGGING_LEVEL: debug
      LIBRARIAN_OPENAI_API_KEY: ${LIBRARIAN_OPENAI_API_KEY}
    networks:
      - librarian_network
    depends_on:
      dev_postgres:
        condition: service_healthy
      dev_neo4j:
        condition: service_healthy
      dev_rabbitmq:
        condition: service_healthy

  dev_admin:
    image: ghcr.io/twistingmercury/librarian-admin:latest-dev
    pull_policy: always
    restart: unless-stopped
    ports:
      - "13000:80"
    networks:
      - librarian_network
    depends_on:
      - dev_api

volumes:
  dev_postgres_data:
  dev_neo4j_data:

networks:
  librarian_network:
    driver: bridge
