# The service images come from MNEMONIC_API_IMAGE, MNEMONIC_MCP_IMAGE and
# MNEMONIC_ENRICHER_IMAGE. pull_policy stays "missing" (not "always") so a
# locally built image is used as is; this suite runs against local builds.
name: mnemonic-it

services:
  postgres:
    image: ghcr.io/twistingmercury/mnemonic-postgres:v1.0.0-dev
    environment:
      POSTGRES_DB: mnemonic
      POSTGRES_USER: mnemonic
      POSTGRES_PASSWORD: mnemonic_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemonic"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - mnemonic-network

  neo4j:
    image: ghcr.io/twistingmercury/mnemonic-neo4j:v1.0.0-dev
    environment:
      NEO4J_AUTH: neo4j/mnemonic_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mnemonic_dev 'RETURN 1' || exit 1"]
      interval: 3s
      timeout: 5s
      start_period: 60s
      retries: 40
    networks:
      - mnemonic-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mnemonic
      RABBITMQ_DEFAULT_PASS: mnemonic_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks:
      - mnemonic-network

  # Stands in for OpenAI so runs are deterministic and need no key.
  openai_stub:
    build:
      context: ../openai-stub
    networks:
      - mnemonic-network

  mnemonic-api:
    image: ${MNEMONIC_API_IMAGE:-ghcr.io/twistingmercury/mnemonic-api:latest-dev}
    pull_policy: missing
    environment:
      MNEMONIC_DATABASE_POSTGRES_HOST: postgres
      MNEMONIC_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      MNEMONIC_DATABASE_POSTGRES_SSL_MODE: disable
      MNEMONIC_DATABASE_NEO4J_URI: bolt://neo4j:7687
      MNEMONIC_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      MNEMONIC_OPENAI_API_KEY: sk-test
      MNEMONIC_OPENAI_BASE_URL: http://openai_stub:8090/v1
      MNEMONIC_LOGGING_LEVEL: error
      MNEMONIC_QUEUE_RABBITMQ_HOST: rabbitmq
      MNEMONIC_QUEUE_RABBITMQ_USER: mnemonic
      MNEMONIC_QUEUE_RABBITMQ_PASSWORD: mnemonic_dev
    depends_on:
      openai_stub:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mnemonic-api", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - mnemonic-network

  mnemonic-mcp:
    image: ${MNEMONIC_MCP_IMAGE:-ghcr.io/twistingmercury/mnemonic-mcp:latest-dev}
    pull_policy: missing
    environment:
      MNEMONIC_DATABASE_POSTGRES_HOST: postgres
      MNEMONIC_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      MNEMONIC_DATABASE_POSTGRES_SSL_MODE: disable
      MNEMONIC_DATABASE_NEO4J_URI: bolt://neo4j:7687
      MNEMONIC_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      MNEMONIC_OPENAI_API_KEY: sk-test
      MNEMONIC_OPENAI_BASE_URL: http://openai_stub:8090/v1
      MNEMONIC_MCP_PORT: 8081
      MNEMONIC_LOGGING_LEVEL: error
    depends_on:
      openai_stub:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mnemonic", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - mnemonic-network

  mnemonic-enricher:
    image: ${MNEMONIC_ENRICHER_IMAGE:-ghcr.io/twistingmercury/mnemonic-enricher:latest-dev}
    pull_policy: missing
    environment:
      MNEMONIC_DATABASE_POSTGRES_HOST: postgres
      MNEMONIC_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      MNEMONIC_DATABASE_POSTGRES_SSL_MODE: disable
      MNEMONIC_DATABASE_NEO4J_URI: bolt://neo4j:7687
      MNEMONIC_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      MNEMONIC_QUEUE_PROVIDER: rabbitmq
      MNEMONIC_QUEUE_RABBITMQ_HOST: rabbitmq
      MNEMONIC_QUEUE_RABBITMQ_USER: mnemonic
      MNEMONIC_QUEUE_RABBITMQ_PASSWORD: mnemonic_dev
      MNEMONIC_QUEUE_RABBITMQ_QUEUE: enrichment-jobs
      # A failed OpenAI call fails the job at once and is retried 1s later by
      # the sweep, which TestEnricherRetriesFailedJob relies on.
      MNEMONIC_OPENAI_RETRY_ATTEMPTS: 0
      MNEMONIC_ENRICHMENT_RETRY_DELAY: 1s
      MNEMONIC_OPENAI_API_KEY: sk-test
      MNEMONIC_OPENAI_BASE_URL: http://openai_stub:8090/v1
      MNEMONIC_LOGGING_LEVEL: error
    depends_on:
      openai_stub:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mnemonic-enricher", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - mnemonic-network

  mnemonic-tests:
    image: golang:1.27.3-alpine
    working_dir: /src
    volumes:
      - .:/src:ro
    environment:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      MNEMONIC_API_URL: http://mnemonic-api:8080
      MNEMONIC_MCP_URL: http://mnemonic-mcp:8081
      MNEMONIC_MCP_OPS_URL: http://mnemonic-mcp:8080
      MNEMONIC_ENRICHER_URL: http://mnemonic-enricher:8080
      MNEMONIC_OPENAI_STUB_URL: http://openai_stub:8090
    command: ["go", "test", "-count=1", "-v", "./..."]
    depends_on:
      mnemonic-api:
        condition: service_healthy
      mnemonic-mcp:
        condition: service_healthy
      mnemonic-enricher:
        condition: service_healthy
    networks:
      - mnemonic-network

volumes:
  postgres-data:
  neo4j-data:

networks:
  mnemonic-network:
    driver: bridge
