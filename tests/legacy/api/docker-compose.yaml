
services:
  postgres:
    image: ghcr.io/twistingmercury/librarian-postgres:v1.0.0-dev
    environment:
      POSTGRES_DB: mnemonic
      POSTGRES_USER: mnemonic
      POSTGRES_PASSWORD: mnemonic_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemonic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - librarian-network

  neo4j:
    image: ghcr.io/twistingmercury/librarian-neo4j:v1.0.0-dev
    environment:
      NEO4J_AUTH: neo4j/mnemonic_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mnemonic_dev 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - librarian-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mnemonic
      RABBITMQ_DEFAULT_PASS: mnemonic_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - librarian-network

  openai_stub:
    build:
      context: ./openai-stub
    networks:
      - librarian-network

# this is the testing target
  librarian_api:
    image: ${LIBRARIAN_API_IMAGE:-ghcr.io/twistingmercury/librarian-api:latest}
    container_name: librarian_api
    pull_policy: never
    environment:
      LIBRARIAN_DATABASE_POSTGRES_HOST: postgres
      LIBRARIAN_DATABASE_POSTGRES_PASSWORD: mnemonic_dev
      LIBRARIAN_DATABASE_POSTGRES_SSL_MODE: disable
      LIBRARIAN_DATABASE_NEO4J_URI: bolt://neo4j:7687
      LIBRARIAN_DATABASE_NEO4J_PASSWORD: mnemonic_dev
      LIBRARIAN_OPENAI_API_KEY: sk-test-dummy
      LIBRARIAN_OPENAI_BASE_URL: http://openai_stub:8090/v1
      LIBRARIAN_LOGGING_LEVEL: error
      LIBRARIAN_QUEUE_RABBITMQ_HOST: rabbitmq
      LIBRARIAN_QUEUE_RABBITMQ_USER: mnemonic
      LIBRARIAN_QUEUE_RABBITMQ_PASSWORD: mnemonic_dev
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      openai_stub:
        condition: service_started
    healthcheck:
      test: ["CMD", "/mnemonic-api", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - librarian-network

  librarian_tests:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: librarian_tests
    environment:
      - API_URL=http://librarian_api:8080
      - METRICS_URL=http://librarian_api:9090
    depends_on:
      librarian_api:
        condition: service_healthy
    networks:
      - librarian-network

volumes:
  postgres-data:
  neo4j-data:

networks:
  librarian-network:
    driver: bridge
