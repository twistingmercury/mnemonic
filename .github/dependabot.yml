version: 2

# Every Dependabot pull request runs the full CI, and a change to go.mod or
# tests/ rebuilds all three services, so updates arrive weekly and minor and
# patch bumps share one pull request per ecosystem. A major bump gets its own.
updates:
  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      # pgx 5.11 added TypeMap() to pgx.Rows; pgxmock v4.9.0 doesn't implement
      # it, so the repository tests stop compiling. Drop this once pgxmock ships
      # a compatible release.
      - dependency-name: github.com/jackc/pgx/v5
        versions: [">=5.11.0"]

  - package-ecosystem: gomod
    directory: /tests/openai-stub
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # uv, not pip: the project is locked by uv.lock.
  - package-ecosystem: uv
    directory: /tests/integration
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # The workflow pins each action by commit SHA with a version comment;
  # Dependabot moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
