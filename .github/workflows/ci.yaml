name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to build, or all of them
        type: choice
        default: all
        options: [all, api, mcp, enricher, db, gateway, helm]

permissions:
  contents: read

# A newer run on the same pull request replaces the older one. A push gets its
# own group: GitHub drops older pending runs of a shared group, and the next
# run's base is the previous push, so a dropped commit would never be built.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      components: ${{ steps.detect.outputs.components }}
      services: ${{ steps.detect.outputs.services }}
    steps:
      # Full history: the change detection diffs against the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The base is the PR base, the commit before a push, or all zeros on a
      # manual run, which makes every component affected.
      - name: Detect affected components
        id: detect
        env:
          MNEMONIC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          MNEMONIC_COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          if [ -n "${MNEMONIC_COMPONENT}" ] && [ "${MNEMONIC_COMPONENT}" != all ]; then
            names="${MNEMONIC_COMPONENT}"
          else
            names="$(build/changed-components.sh "${MNEMONIC_BASE_SHA}" "${GITHUB_SHA}")"
          fi
          components="$(jq -R -s -c 'split("\n") | map(select(. != ""))' <<<"${names}")"
          printf 'components=%s\n' "${components}" >> "${GITHUB_OUTPUT}"
          printf 'services=%s\n' "$(jq -c 'map(select(. == "api" or . == "mcp" or . == "enricher"))' <<<"${components}")" >> "${GITHUB_OUTPUT}"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          git ls-files -z '*.sh' '*.bash' ':!tests/bats/test_helper/bats-*' \
            | xargs -0 docker run --rm -v "${PWD}:/repo:ro" -w /repo \
              koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

      - name: hadolint
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -w /repo \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --failure-threshold warning build/*/*.Dockerfile db/*/Dockerfile

      - name: markdownlint
        run: |
          git ls-files -z '*.md' \
            | xargs -0 docker run --rm -v "${PWD}:/repo:ro" -w /repo \
              ghcr.io/igorshubovych/markdownlint-cli:v0.49.1@sha256:905baf9f6bd11da2ede8c394882c616509385f24b8b8d54fff6e111be88f39de \
              -c .markdownlint.json

      - name: helm lint
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -w /repo \
            alpine/helm:4.3.1@sha256:e3f8d5c462d75470fbb1fce79ad5c20063657096d1f98c0fcea869e2600e2e5e \
            lint --strict deploy/helm/mnemonic

      # The BATS image has no git and the tests need it, so bats is mounted
      # from its image into a Debian Go image, which has git and GNU grep. The
      # db files listed are the ones that need no database; the migration and
      # image tests run in the db job.
      # --mount does not pull its source image, so it is pulled first.
      - name: bats
        run: |
          docker pull bats/bats:1.14.0@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f
          docker run --rm -v "${PWD}:/repo:ro" -w /repo \
            --mount type=image,source=bats/bats:1.14.0@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f,target=/bats,readonly \
            --entrypoint /bats/opt/bats/bin/bats \
            golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5 \
            tests/bats db/tests/bats/build-scripts.bats db/tests/bats/build-version.bats db/tests/bats/schema-entrypoint.bats

      - name: e2e boundary check
        run: build/check-e2e-boundary.sh

  # A matrix needs at least one entry, so the job is skipped when no service is
  # affected. The script builds the image, runs the e2e suite and never pushes.
  service:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test
        env:
          MNEMONIC_COMPONENT: ${{ matrix.component }}
        run: build/"${MNEMONIC_COMPONENT}"/"${MNEMONIC_COMPONENT}".build.sh

      # The publish job pushes this exact tested image. Only pushes upload it;
      # the trigger limits pushes to develop and main.
      - name: Save the image
        if: github.event_name == 'push'
        env:
          MNEMONIC_COMPONENT: ${{ matrix.component }}
        run: docker save --output "${RUNNER_TEMP}/image-${MNEMONIC_COMPONENT}.tar" "ghcr.io/twistingmercury/mnemonic-${MNEMONIC_COMPONENT}:latest"

      - name: Upload the image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/image-${{ matrix.component }}.tar
          if-no-files-found: error
          retention-days: 1

  # The one required check. It runs even when a job it needs failed or was
  # skipped, and fails on a failure or a cancellation (detection included); a
  # skipped job is fine.
  ci-gate:
    if: always()
    needs: [detect, static, service]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results of the jobs this run needed
        env:
          MNEMONIC_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<<"${MNEMONIC_NEEDS}"
