{{- $c := dict "ctx" $ "component" "enricher" }}
{{- $v := .Values.enricher }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.serviceName }}
  labels:
    {{- include "mnemonic.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "mnemonic.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnemonic-enricher
  labels:
    {{- include "mnemonic.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mnemonic.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mnemonic.labels" $c | nindent 8 }}
      annotations:
        checksum/credentials: {{ include (print $.Template.BasePath "/secret-dev-credentials.yaml") . | sha256sum }}
    spec:
      {{- include "mnemonic.podDefaults" . | nindent 6 }}
      # The image sets no user; it runs as the same non-root user as the API.
      securityContext:
        {{- include "mnemonic.podSecurityContext" 65532 | nindent 8 }}
      containers:
        - name: enricher
          image: {{ $v.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "mnemonic.serviceEnv" (dict "ctx" $ "logLevel" $v.logLevel) | nindent 12 }}
            - name: MNEMONIC_QUEUE_PROVIDER
              value: rabbitmq
            {{- include "mnemonic.rabbitmqEnv" . | nindent 12 }}
            - name: MNEMONIC_QUEUE_RABBITMQ_QUEUE
              value: {{ $v.queue | quote }}
          ports:
            - name: http
              containerPort: {{ $v.port }}
          {{- include "mnemonic.serviceProbes" . | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "mnemonic.containerSecurityContext" true | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
