{{- $c := dict "ctx" $ "component" "neo4j" }}
{{- $v := .Values.neo4j }}
{{- $secret := include "librarian.credentialsSecret" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.serviceName }}
  labels:
    {{- include "librarian.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "librarian.selectorLabels" $c | nindent 4 }}
  ports:
    - name: bolt
      port: {{ $v.boltPort }}
      targetPort: bolt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    {{- include "librarian.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $v.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "librarian.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librarian.labels" $c | nindent 8 }}
      annotations:
        checksum/credentials: {{ include (print $.Template.BasePath "/secret-dev-credentials.yaml") . | sha256sum }}
    spec:
      {{- include "librarian.podDefaults" . | nindent 6 }}
      # Neo4j needs about 10s to stop cleanly.
      terminationGracePeriodSeconds: 30
      # Runs directly as the image's neo4j user (7474) instead of starting as
      # root and dropping privileges.
      securityContext:
        {{- include "librarian.podSecurityContext" 7474 | nindent 8 }}
      containers:
        - name: neo4j
          image: {{ $v.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: neo4j-auth }
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: apoc.*
            - name: NEO4J_dbms_security_procedures_allowlist
              value: apoc.*
            # Without these Neo4j sizes heap and page cache from the node's
            # memory and outgrows the container limit.
            - name: NEO4J_server_memory_heap_initial__size
              value: {{ $v.heapSize | quote }}
            - name: NEO4J_server_memory_heap_max__size
              value: {{ $v.heapSize | quote }}
            - name: NEO4J_server_memory_pagecache_size
              value: {{ $v.pageCacheSize | quote }}
          ports:
            - name: bolt
              containerPort: 7687
          # The image applies its schema after Neo4j starts and writes
          # /tmp/schema_ready when done. The password comes from NEO4J_AUTH and
          # goes to cypher-shell as an env var, not an argument.
          startupProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/schema_ready"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/schema_ready && NEO4J_PASSWORD="${NEO4J_AUTH#*/}" cypher-shell -u "${NEO4J_AUTH%%/*}" 'RETURN 1' >/dev/null
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: { port: bolt }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          # readOnlyRootFilesystem is off: the image's entrypoint rewrites
          # conf/neo4j.conf from the NEO4J_ variables and copies APOC into the
          # plugins directory at every start.
          securityContext:
            {{- include "librarian.containerSecurityContext" false | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "librarian.selectorLabels" $c | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $v.storageClass }}
        resources:
          requests:
            storage: {{ $v.storage }}
