{{- $c := dict "ctx" $ "component" "rabbitmq" }}
{{- $v := .Values.rabbitmq }}
{{- $secret := include "librarian.credentialsSecret" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $v.serviceName }}
  labels:
    {{- include "librarian.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "librarian.selectorLabels" $c | nindent 4 }}
  ports:
    - name: amqp
      port: {{ $v.port }}
      targetPort: amqp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "librarian.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $v.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "librarian.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librarian.labels" $c | nindent 8 }}
      annotations:
        checksum/credentials: {{ include (print $.Template.BasePath "/secret-dev-credentials.yaml") . | sha256sum }}
    spec:
      {{- include "librarian.podDefaults" . | nindent 6 }}
      # The image's rabbitmq user (100:101); the StatefulSet keeps the pod
      # hostname, and with it the node name, stable across restarts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        # Not recursive: RabbitMQ refuses an Erlang cookie that others can read.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: {{ $v.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rabbitmq-user }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rabbitmq-password }
          ports:
            - name: amqp
              containerPort: 5672
          startupProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket: { port: amqp }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "librarian.containerSecurityContext" true | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "librarian.selectorLabels" $c | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $v.storageClass }}
        resources:
          requests:
            storage: {{ $v.storage }}
