{{- /* DEV ONLY: the throwaway credentials from values.devCredentials. */ -}}
{{- $creds := .Values.devCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "librarian.credentialsSecret" . }}
  labels:
    {{- include "librarian.labels" (dict "ctx" $ "component" "credentials") | nindent 4 }}
  annotations:
    librarian.dev/purpose: "dev-only credentials; replace before any shared deployment"
type: Opaque
stringData:
  postgres-database: {{ $creds.postgres.database | quote }}
  postgres-user: {{ $creds.postgres.user | quote }}
  postgres-password: {{ $creds.postgres.password | quote }}
  neo4j-password: {{ $creds.neo4j.password | quote }}
  neo4j-auth: {{ printf "%s/%s" $creds.neo4j.user $creds.neo4j.password | quote }}
  rabbitmq-user: {{ $creds.rabbitmq.user | quote }}
  rabbitmq-password: {{ $creds.rabbitmq.password | quote }}
  keycloak-admin-user: {{ $creds.keycloakAdmin.user | quote }}
  keycloak-admin-password: {{ $creds.keycloakAdmin.password | quote }}
