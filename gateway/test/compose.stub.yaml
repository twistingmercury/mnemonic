# The gateway alone, with stub upstreams standing in for mnemonic-api and
# mnemonic-mcp. Used by CI and `make e2e-stub`; needs no Mnemonic images,
# databases or OpenAI key.

services:
  envoy:
    extends: { file: ../docker-compose.yaml, service: envoy }
  opa:
    extends: { file: ../docker-compose.yaml, service: opa }
  keycloak:
    extends: { file: ../docker-compose.yaml, service: keycloak }

  mnemonic-api:
    build: ./stub
    environment: { STUB_NAME: mnemonic-api, STUB_LISTEN: ":8080" }
    networks: [internal]

  mnemonic-mcp:
    build: ./stub
    environment: { STUB_NAME: mnemonic-mcp, STUB_LISTEN: ":8081" }
    networks: [internal]

networks:
  edge:
  internal:
    internal: true
