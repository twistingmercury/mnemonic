# Two edges, one per service. Each verifies the caller's JWT (jwt_authn),
# then asks OPA (ext_authz) before forwarding. The services carry no auth
# code and must be reachable only through these listeners.
#
# Dev values: the issuer and the public URLs below assume the local compose
# stack (Keycloak on localhost:18180, edges on localhost:18080 and :18081).

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------- API edge
    - name: api_edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: api_edge
                use_remote_address: true
                # Envoy replaces any client-supplied x-request-id on edge requests.
                generate_request_id: true
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                route_config:
                  name: api
                  request_headers_to_remove: [x-correlation-id]
                  virtual_hosts:
                    - name: api
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: librarian_api
                            # The service's own write timeout is 30s.
                            timeout: 35s
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions: { edge: api }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: http://localhost:18180/realms/mnemonic
                          audiences: [mnemonic-api]
                          remote_jwks: &jwks
                            http_uri:
                              uri: http://keycloak:8080/realms/mnemonic/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: 300s
                            async_fetch: { fast_listener: false }
                            retry_policy:
                              num_retries: 10
                              retry_back_off: { base_interval: 1s, max_interval: 10s }
                          # Verified claims go to OPA as metadata; the token itself is
                          # removed before the request reaches the service.
                          payload_in_metadata: jwt_payload
                          forward: false
                          clock_skew_seconds: 30
                      rules:
                        - match: { path: /version }
                        - match: { prefix: / }
                          requires: { provider_name: keycloak }
                  - name: envoy.filters.http.ext_authz
                    typed_config: &ext_authz
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: { cluster_name: opa }
                        timeout: 0.5s
                      failure_mode_allow: false
                      status_on_error: { code: ServiceUnavailable }
                      metadata_context_namespaces: [envoy.filters.http.jwt_authn]
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ---------------------------------------------------------------- MCP edge
    - name: mcp_edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_edge
                use_remote_address: true
                generate_request_id: true
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                # MCP clients start OAuth from the 401 challenge (RFC 9728), and
                # learn which scope they lack from the 403 one.
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value: { default_value: 401, runtime_key: mcp_edge.unused_401 }
                      headers_to_add:
                        - header:
                            key: WWW-Authenticate
                            value: 'Bearer resource_metadata="http://localhost:18081/.well-known/oauth-protected-resource/mcp"'
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value: { default_value: 403, runtime_key: mcp_edge.unused_403 }
                      headers_to_add:
                        - header:
                            key: WWW-Authenticate
                            value: 'Bearer error="insufficient_scope", scope="mcp:read mcp:search", resource_metadata="http://localhost:18081/.well-known/oauth-protected-resource/mcp"'
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                route_config:
                  name: mcp
                  request_headers_to_remove: [x-correlation-id]
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        # Protected Resource Metadata (RFC 9728), at both the
                        # path-suffixed and the bare well-known location.
                        - match: { path: /.well-known/oauth-protected-resource/mcp }
                          direct_response: &prm
                            status: 200
                            body:
                              inline_string: '{"resource":"http://localhost:18081/mcp","authorization_servers":["http://localhost:18180/realms/mnemonic"],"scopes_supported":["mcp:read","mcp:search"],"bearer_methods_supported":["header"]}'
                          response_headers_to_add: &json
                            - header: { key: Content-Type, value: application/json }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          typed_per_filter_config: &no_authz
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { path: /.well-known/oauth-protected-resource }
                          direct_response: *prm
                          response_headers_to_add: *json
                          typed_per_filter_config: *no_authz
                        - match: { prefix: "/" }
                          route:
                            cluster: librarian_mcp
                            # Responses may be SSE streams; no overall deadline.
                            timeout: 0s
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions: { edge: mcp }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: http://localhost:18180/realms/mnemonic
                          audiences: [mnemonic-mcp]
                          remote_jwks: *jwks
                          payload_in_metadata: jwt_payload
                          forward: false
                          clock_skew_seconds: 30
                      rules:
                        - match: { prefix: /.well-known/ }
                        - match: { prefix: / }
                          requires: { provider_name: keycloak }
                  - name: envoy.filters.http.ext_authz
                    typed_config: *ext_authz
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: librarian_api
      type: STRICT_DNS
      load_assignment:
        cluster_name: librarian_api
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: librarian-api, port_value: 8080 } } }

    - name: librarian_mcp
      type: STRICT_DNS
      load_assignment:
        cluster_name: librarian_mcp
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: librarian-mcp, port_value: 8081 } } }

    - name: opa
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: opa, port_value: 9191 } } }

    - name: keycloak
      type: STRICT_DNS
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: keycloak, port_value: 8080 } } }
